# Rogue (attacker-controlled) DNS resolver
# Runs on the ATTACKER host h3 (10.0.10.13).
# Answers the lab domain with an ATTACKER-CHOSEN IP, so a hijacked
# victim is sent to the wrong place for every name it looks up.

# Do not read /etc/resolv.conf or /etc/hosts for upstream answers.
no-resolv
no-hosts

# Only listen on the attacker's own address (and loopback).
listen-address=127.0.0.1,10.0.10.13
bind-interfaces
port=53

# --- The poison ---
# Any lookup of www.lab.example is answered with the attacker's IP.
address=/www.lab.example/10.6.6.66
# Catch-all: answer EVERY domain with the attacker IP (comment out if
# you only want to hijack the one name above).
address=/#/10.6.6.66

# Log every query so you can show the hijack in the attacker's terminal.
log-queries
log-facility=-
