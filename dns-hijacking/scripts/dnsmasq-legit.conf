# Legitimate DNS resolver (the one the victim is SUPPOSED to use).
# Runs on the server host srv (10.0.30.10).
# Answers the lab domain with the REAL IP. Used to establish the
# "before attack" baseline so you can prove the answer changes.

no-resolv
no-hosts

listen-address=127.0.0.1,10.0.30.10
bind-interfaces
port=53

# The honest answers for the lab domain.
#   www.lab.example      -> the name the attacker TAMPERS with (proves alteration)
#   intranet.lab.example -> a name the attacker does NOT touch; the attacker must
#                           forward it here and relay the real answer back
#                           (proves the real server is still in the loop = true MITM)
address=/www.lab.example/10.0.30.80
address=/intranet.lab.example/10.0.30.90

log-queries
log-facility=/tmp/srv_dns.log
