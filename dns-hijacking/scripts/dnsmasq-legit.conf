# Legitimate DNS resolver (the one the victim is SUPPOSED to use).
# Runs on the server host srv (10.0.30.10).
# Answers the lab domain with the REAL IP. Used to establish the
# "before attack" baseline so you can prove the answer changes.

no-resolv
no-hosts

listen-address=127.0.0.1,10.0.30.10
bind-interfaces
port=53

# The honest answer for the lab domain.
address=/www.lab.example/10.0.30.80

log-queries
log-facility=-
